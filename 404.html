<script>
const path = location.pathname
  .replace(/^\/+/, "")
  .replace(/\/+$/, "");

const reserved = [
  "",
  "login",
  "register",
  "dashboard",
  "profile"
];

if (
  path &&
  !reserved.includes(path)
) {

  sessionStorage.setItem(
    "profile_username",
    path
  );

  location.replace("/profile");

}
</script>
