<script>
const path = location.pathname
  .replace(/^\/+/,"")
  .replace(/\/+$/,"");

const reserved = [
  "",
  "login",
  "register",
  "dashboard",
  "profile.html",
  "404.html"
];

if (
  path &&
  !reserved.includes(path)
) {
  location.replace(
    "/profile.html?u=" +
    encodeURIComponent(path)
  );
}
</script>
